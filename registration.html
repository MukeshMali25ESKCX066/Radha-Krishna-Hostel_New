<!DOCTYPE html>

<html>

<head>

<title>Student Registration</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h2>Student Registration</h2>

<form method="POST">

<div class="alert alert-info">
    Hostel fee is fixed at <strong>₹114000</strong>. Students are charged this amount automatically.
</div>

<div class="alert alert-warning">
    Once the admin approves your account, you will be able to access your full hostel dashboard, ID cards, complaints, laundry token, and notifications.
</div>

<input
class="form-control mb-3"
name="name"
placeholder="Full Name">

<input
class="form-control mb-3"
name="email"
placeholder="Email">

<input
class="form-control mb-3"
name="phone"
placeholder="Phone">

<input
class="form-control mb-3"
name="hostel"
placeholder="Hostel Name">

<input
class="form-control mb-3"
name="block"
placeholder="Block">

<input
class="form-control mb-3"
name="room"
placeholder="Room Number">

<input
type="password"
class="form-control mb-3"
name="password"
placeholder="Password">

<button
class="btn btn-primary">

Register

</button>

</form>

</div>

</body>

</html>
